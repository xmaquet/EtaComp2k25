<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Comparateur">
  <defs>
    <linearGradient id="housing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d5a80"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="dial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#778da9"/>
      <stop offset="100%" stop-color="#415a77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0d1b2a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="256" height="256" rx="48" fill="#edf2f7"/>

  <!-- Corps du comparateur -->
  <g filter="url(#shadow)">
    <rect x="68" y="28" width="120" height="96" rx="18" fill="url(#housing)"/>
    <rect x="74" y="34" width="108" height="84" rx="14" fill="#2a4365"/>
  </g>

  <!-- Cadran -->
  <circle cx="128" cy="76" r="38" fill="url(#dial)" stroke="#cbd5e0" stroke-width="2"/>
  <circle cx="128" cy="76" r="32" fill="none" stroke="#a0aec0" stroke-width="1"/>

  <!-- Graduations -->
  <g stroke="#4a5568" stroke-width="2.2" stroke-linecap="round">
    <line x1="128" y1="46" x2="128" y2="54"/>
    <line x1="148.5" y1="52.5" x2="145" y2="58.5"/>
    <line x1="159.5" y1="68" x2="153" y2="70"/>
    <line x1="159.5" y1="84" x2="153" y2="82"/>
    <line x1="148.5" y1="99.5" x2="145" y2="93.5"/>
    <line x1="107.5" y1="52.5" x2="111" y2="58.5"/>
    <line x1="96.5" y1="68" x2="103" y2="70"/>
    <line x1="96.5" y1="84" x2="103" y2="82"/>
    <line x1="107.5" y1="99.5" x2="111" y2="93.5"/>
  </g>

  <!-- Repère zéro -->
  <rect x="124" y="48" width="8" height="10" rx="1" fill="#e53e3e"/>

  <!-- Aiguille -->
  <g transform="rotate(28 128 76)">
    <line x1="128" y1="76" x2="128" y2="54" stroke="#e53e3e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="128" cy="76" r="4.5" fill="#2d3748"/>
    <circle cx="128" cy="76" r="2" fill="#e53e3e"/>
  </g>

  <!-- Lunette / bague -->
  <circle cx="128" cy="76" r="38" fill="none" stroke="#718096" stroke-width="3" opacity="0.55"/>

  <!-- Tige rentrante -->
  <g filter="url(#shadow)">
    <rect x="118" y="124" width="20" height="72" rx="6" fill="url(#stem)"/>
    <rect x="121" y="128" width="14" height="64" rx="4" fill="#5a6f88" opacity="0.45"/>
    <rect x="104" y="192" width="48" height="18" rx="6" fill="#1d3557"/>
    <rect x="110" y="196" width="36" height="10" rx="3" fill="#415a77"/>
  </g>

  <!-- Point de contact -->
  <circle cx="128" cy="210" r="7" fill="#4a5568"/>
  <circle cx="128" cy="210" r="3" fill="#a0aec0"/>

  <!-- Symbole métrologie (mm) discret -->
  <text x="128" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5568" letter-spacing="1">mm</text>
</svg>
